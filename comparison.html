<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Порівняння іконок - до та після</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .comparison-grid {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        .grid-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .grid-header-cell {
            padding: 20px;
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .grid-header-cell:first-child {
            border-right: 1px solid #e9ecef;
        }

        .images-container {
            padding: 0;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .comparison-row {
            display: grid;
            grid-template-columns: 200px 200px;
            height: 240px;
            border-bottom: 1px solid #e9ecef;
            justify-content: center;
            background: #42494f;
        }

        .comparison-row:last-child {
            border-bottom: none;
        }

        .comparison-row:hover {
            background: #161617;
        }

        .image-cell {
            display: flex;
            flex-direction: column;
            border: 1px solid #e9ecef;
            overflow: hidden;
        }

        .comparison-row .image-cell:last-child {
            border-right: none;
        }

        .image-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            transition: background 0.2s;
        }

        .image-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            width: 100%;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 1px solid #000;

        }

        .image-name {
            padding: 8px;
            font-size: 0.8em;
            color: #666;
            text-align: center;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #aaa;
            text-align: center;
            width: 100%;
        }

        .stats {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .comparison-row {
                grid-template-columns: 1fr;
            }

            .image-cell {
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }

            .comparison-row .image-cell:last-child {
                border-bottom: none;
            }

            .grid-header {
                grid-template-columns: 1fr;
            }

            .grid-header-cell:first-child {
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ Порівняння іконок</h1>
            <p>До та після нормалізації</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="comparison-grid">
            <div class="grid-header">
                <div class="grid-header-cell">📁 Вихідні іконки</div>
                <div class="grid-header-cell">✨ Обробленні іконки</div>
            </div>
            <div class="images-container" id="comparison-container"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="total-stat">0</div>
                <div class="stat-label">Всього іконок</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="processed-stat">0</div>
                <div class="stat-label">Обробленних</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="missing-stat">0</div>
                <div class="stat-label">Без пари</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function loadImages() {
            try {
                const response = await fetch(API_BASE + '/images');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                renderComparison(data);
            } catch (error) {
                showError(`Помилка при завантаженні даних: ${error.message}`);
            }
        }

        function renderComparison(data) {
            const container = document.getElementById('comparison-container');
            container.innerHTML = '';

            const inFiles = data.in || [];
            const outFiles = data.out || [];

            if (inFiles.length === 0 && outFiles.length === 0) {
                container.innerHTML = '<div class="empty-state"><div>📭 Обидві папки порожні</div></div>';
                document.getElementById('total-stat').textContent = 0;
                document.getElementById('processed-stat').textContent = 0;
                document.getElementById('missing-stat').textContent = 0;
                return;
            }

            // Combine all unique filenames
            const allFiles = new Set([...inFiles, ...outFiles]);
            const sortedFiles = Array.from(allFiles).sort();

            sortedFiles.forEach(filename => {
                const hasIn = inFiles.includes(filename);
                const hasOut = outFiles.includes(filename);

                const row = document.createElement('div');
                row.className = 'comparison-row';

                // In column
                const inCell = document.createElement('div');
                inCell.className = 'image-cell';
                if (hasIn) {
                    inCell.appendChild(createImageItem(filename, 'in'));
                } else {
                    inCell.innerHTML = '<div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #ccc;">❌ Нема файлу</div>';
                }

                // Out column
                const outCell = document.createElement('div');
                outCell.className = 'image-cell';
                if (hasOut) {
                    outCell.appendChild(createImageItem(filename, 'out'));
                } else {
                    outCell.innerHTML = '<div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #ccc;">❌ Нема файлу</div>';
                }

                row.appendChild(inCell);
                row.appendChild(outCell);
                container.appendChild(row);
            });

            document.getElementById('total-stat').textContent = sortedFiles.length;
            document.getElementById('processed-stat').textContent = outFiles.length;

            const missing = inFiles.filter(f => !outFiles.includes(f)).length;
            document.getElementById('missing-stat').textContent = missing;
        }

        function createImageItem(filename, type) {
            const item = document.createElement('div');
            item.className = 'image-item';

            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const img = document.createElement('img');
            img.src = `/files/${type}/${filename}`;
            img.alt = filename;
            img.onerror = () => {
                wrapper.innerHTML = '❌ Помилка';
            };

            wrapper.appendChild(img);

            const name = document.createElement('div');
            name.className = 'image-name';
            name.textContent = filename;
            name.title = filename;

            item.appendChild(wrapper);
            item.appendChild(name);

            return item;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Load images on page load
        loadImages();

        // Reload every 2 seconds to show new files
        // setInterval(loadImages, 2000);
    </script>
</body>
</html>
